<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ficha RPG</title>
</head>
<body>
    <header>
    <h1>Ficha do Personagem</h1>
    </header>

    <main>
    <form>
        <fieldset>
            <legend>Informações do Personagem</legend>

        <table>
            <tr>
                <td>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome" name="nome">
                </td>  

                <td>
                    <label for="idade">Idade:</label>
                    <input type="number" id="idade" name="idade" required>
                </td>
            </tr>
            <tr>
                <td>
                    <label for="classe">Classe:</label>
                    <input type="text" name="classe" id="classe">
                </td>

                <td>
                    <label for="nivel">Nivel:</label>
                    <input type="number" name="nivel" id="nivel" min="1">
                </td>
            </tr>
        </table>

        <br>

        <label for="foto">Escolha uma foto</label>


        <input type="file"
        id="foto"
        name="foto"
        accept=".jpg,.jpeg,.png"
        >

        </fieldset>

        <fieldset>

        <h2>Biografia</h2>

        <label for="biografia">Conte-nos sua historia</label>

        <br>

        <textarea id="biografia" name="biografia" rows="15" cols="50"></textarea>

        </fieldset>



        <fieldset>

            <legend>Atributos</legend>

        <table>

                <tr>
                    <th>Atributo</th>
                    <th>Valor</th>
                </tr>

                <tr>
                    <td>Constituição:</td>
                    <td><input type="number" name="constituicao" min="1" max="20" required></td>
                </tr>

                <tr>
                    <td>Força:</td>
                    <td><input type="number" name="forca" min="1" max="20" required></td>
                </tr>

                <tr>
                    <td>Destreza:</td>
                    <td><input type="number" name="destreza" min="1" max="20" required></td>
                </tr>

                <tr>
                    <td>Inteligência:</td>
                    <td><input type="number" name="inteligencia" min="1" max="20" required></td>
                </tr>

                <tr>
                    <td>Sabedoria:</td>
                    <td><input type="number" name="sabedoria" min="1" max="20" required></td>
                </tr>

                <tr>
                    <td>Carisma:</td>
                    <td><input type="number" name="carisma" min="1" max="20" required></td>
                </tr>

            </table>
        </fieldset>

        <fieldset>

            <legend>Itens</legend>

        <label for="item">Quais itens carregas?</label>

        <table>
            <tr>
            <th>Nome</th>
            <th>Quantidade</th>
            </tr>

            <tr>
                <td><input type="text" name="item"></td>
                <td><input type="number" name="quantity" min="0"></td>
            </tr>

            <tr>
                <td><input type="text" name="item"></td>
                <td><input type="number" name="quantity" min="0"></td>
            </tr>

            <tr>
                <td><input type="text" name="item"></td>
                <td><input type="number" name="quantity" min="0"></td>
            </tr>

        </table>
            <br><br>
            <button type="submit">Salvar Ficha</button>
    </form>
    </fieldset>
    </main>

    
</body>
</html>
